    <script type="text/plain" class="code" data-name="4 · Green: the general rule">
      test('parses minutes', () => {
        assert.equal(parseDuration('5m'), 5 * 60_000);
      });
      test('parses hours and seconds', () => {
        assert.equal(parseDuration('2h'), 2 * 3_600_000);
        assert.equal(parseDuration('45s'), 45_000);
      });
      test('adds up several parts', () => {
        assert.equal(parseDuration('1h 30m'), 90 * 60_000);
      });

      const UNITS = { h: 3_600_000, m: 60_000, s: 1000 };
      function parseDuration(text) {
        let total = 0;
        for (const [, amount, unit] of text.matchAll(/(\d+)\s*([hms])/g)) total += amount * UNITS[unit];
        return total;
      }

    <script type="text/plain" class="code" data-name="6 · Green, then refactor">
      test('parses minutes', () => {
        assert.equal(parseDuration('5m'), 5 * 60_000);
      });
      test('parses hours and seconds', () => {
        assert.equal(parseDuration('2h'), 2 * 3_600_000);
        assert.equal(parseDuration('45s'), 45_000);
      });
      test('adds up several parts', () => {
        assert.equal(parseDuration('1h 30m'), 90 * 60_000);
      });
      test('rejects text it does not understand', () => {
        assert.throws(() => parseDuration(''), SyntaxError);
        assert.throws(() => parseDuration('5 minutes'), SyntaxError);
        assert.throws(() => parseDuration('1h 30x'), SyntaxError);
      });

      // The whole text must be "<number><unit>" parts separated by spaces; the tests make this rewrite safe
      const UNITS = { h: 3_600_000, m: 60_000, s: 1000 };
      const PART = /^(\d+)([hms])$/;

      function parseDuration(text) {
        const parts = text.trim().split(/\s+/);
        return parts.reduce((total, part) => {
          const match = PART.exec(part);
          if (!match) throw new SyntaxError(`Cannot read "${part}" in "${text}"`);
          return total + Number(match[1]) * UNITS[match[2]];
        }, 0);
      }

      console.log(parseDuration('1h 30m 15s'), 'ms');
    </script>
