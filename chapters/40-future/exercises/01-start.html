<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../../assets/demo.js"></script>
  <link rel="stylesheet" href="../../../assets/style.css">
  <script src="../../../assets/playground.js" defer></script>
  <title>Exercise 40-1 · Start: Implement a Spec Algorithm</title>
</head>
<body class="demo">
  <div class="playground" data-title="Exercise 40-1">
    <script type="text/plain" class="code">
      // Implement at(arrayLike, index) by following the specification of Array.prototype.at, step by step:
      //
      //   Array.prototype.at ( index )
      //   1. Let O be ? ToObject(this value).
      //   2. Let len be ? LengthOfArrayLike(O).
      //   3. Let relativeIndex be ? ToIntegerOrInfinity(index).
      //   4. If relativeIndex ≥ 0, then let k be relativeIndex.
      //   5. Else, let k be len + relativeIndex.
      //   6. If k < 0 or k ≥ len, return undefined.
      //   7. Return ? Get(O, ! ToString(𝔽(k))).
      //
      //   ToIntegerOrInfinity ( argument )
      //   1. Let number be ? ToNumber(argument).
      //   2. If number is one of NaN, +0, or -0, return 0.
      //   3. If number is +∞, return +∞.  4. If number is -∞, return -∞.
      //   5. Return truncate(number).
      //
      //   LengthOfArrayLike ( obj ): return ? ToLength(? Get(obj, "length")).
      //   ToLength ( argument ): let len be ? ToIntegerOrInfinity(argument); if len ≤ 0, return 0;
      //                          return min(len, 2⁵³ - 1).
      //
      // "?" means: if this step throws, let the error through. ToObject throws a TypeError for null and undefined.
      // The tests compare your function with the browser's own Array.prototype.at on many inputs.
      function at(arrayLike, index) {
        const len = arrayLike.length;
        const k = index >= 0 ? index : len + index;
        return arrayLike[k];
      }

      console.log(at(['a', 'b', 'c'], -1), at('hello', 1.9), at({ length: 2, 0: 'x', 1: 'y' }, '-2'));
    </script>
    <script type="text/plain" class="tests">
      const native = (value, index) => Array.prototype.at.call(value, index);
      const same = (value, index) => assert.deepEqual(at(value, index), native(value, index), `at(${JSON.stringify(value)}, ${String(index)})`);

      test('ordinary arrays, positive and negative', () => {
        for (const index of [0, 1, 2, 3, -1, -3, -4]) same(['a', 'b', 'c'], index);
      });
      test('index conversion: strings, fractions, NaN, booleans, undefined', () => {
        for (const index of ['1', '-1', 1.9, -1.9, -0.5, NaN, true, undefined, null, '', ' 2 ', 'x']) same(['a', 'b', 'c'], index);
      });
      test('infinities never land inside the array', () => {
        same(['a'], Infinity);
        same(['a'], -Infinity);
      });
      test('array-likes and strings, with odd lengths', () => {
        same('hello', -1);
        same({ length: 2, 0: 'x', 1: 'y' }, 1);
        same({ length: '3', 2: 'z' }, -1);
        same({ length: -5, 0: 'x' }, 0);
        same({ length: 1.7, 0: 'x' }, 0);
        same({}, 0);
        same({ length: 2 ** 60, [2 ** 53 - 2]: 'last' }, -1);
      });
      test('null and undefined throw a TypeError, like ToObject', () => {
        assert.throws(() => at(null, 0), TypeError);
        assert.throws(() => at(undefined, 0), TypeError);
      });
      test('length is read before the index is converted', () => {
        const log = [];
        const list = { get length() { log.push('length'); return 1; }, 0: 'x' };
        const index = { valueOf() { log.push('index'); return 0; } };
        at(list, index);
        assert.deepEqual(log, ['length', 'index']);
      });
    </script>
  </div>
</body>
</html>
