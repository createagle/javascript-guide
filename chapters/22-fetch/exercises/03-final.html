<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../../assets/demo.js"></script>
  <link rel="stylesheet" href="../../../assets/style.css">
  <script src="../../../assets/playground.js" defer></script>
  <title>Exercise 22-3 · Final: Download Progress</title>
</head>
<body class="demo">
  <div class="playground" data-title="Exercise 22-3">
    <script type="text/plain" class="code">
      // Builds a response whose body arrives in pieces, like a slow download
      function slowResponse(chunks, { length = true } = {}) {
        const bytes = chunks.map((c) => new TextEncoder().encode(c));
        const body = new ReadableStream({
          async pull(controller) {
            await new Promise((resolve) => setTimeout(resolve, 10));
            if (bytes.length) controller.enqueue(bytes.shift());
            else controller.close();
          },
        });
        const size = bytes.reduce((n, b) => n + b.length, 0);
        return new Response(body, { headers: length ? { 'Content-Length': String(size) } : {} });
      }

      // readWithProgress(response, onProgress) should read the body piece by piece,
      // call onProgress(receivedBytes, totalBytes) after every piece (totalBytes from the
      // Content-Length header, or null without one), and resolve to the whole text.
      async function readWithProgress(response, onProgress) {
        const total = Number(response.headers.get('Content-Length')) || null;
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let received = 0;
        let text = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          text += decoder.decode(value, { stream: true });   // a character may be split between pieces
          onProgress(received, total);
        }
        return text + decoder.decode();
      }

      const text = await readWithProgress(slowResponse(['Hello, ', 'streaming ', 'world']), (received, total) => {
        console.log(`${received} / ${total} bytes`);
      });
      console.log(text);
    </script>
    <script type="text/plain" class="tests">
      test('reports progress after every piece', async () => {
        const calls = [];
        await readWithProgress(slowResponse(['aaaaa', 'bbbbb', 'ccccc']), (r, t) => calls.push([r, t]));
        assert.deepEqual(calls, [[5, 15], [10, 15], [15, 15]]);
      });
      test('resolves to the whole text', async () => {
        assert.equal(await readWithProgress(slowResponse(['Hello, ', 'world']), () => {}), 'Hello, world');
      });
      test('total is null without Content-Length', async () => {
        const calls = [];
        await readWithProgress(slowResponse(['ab', 'cd'], { length: false }), (r, t) => calls.push([r, t]));
        assert.deepEqual(calls, [[2, null], [4, null]]);
      });
      test('a character split between pieces survives', async () => {
        const bytes = new TextEncoder().encode('你好');           // 6 bytes, 3 per character
        const body = new ReadableStream({
          start(controller) {
            controller.enqueue(bytes.slice(0, 4));
            controller.enqueue(bytes.slice(4));
            controller.close();
          },
        });
        assert.equal(await readWithProgress(new Response(body), () => {}), '你好');
      });
    </script>
  </div>
</body>
</html>
