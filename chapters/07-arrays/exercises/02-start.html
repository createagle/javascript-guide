    <script type="text/plain" class="tests">
      const items = [
        { name: 'Banana', category: 'fruit' },
        { name: 'Leek', category: 'vegetable' },
        { name: 'Apple', category: 'fruit' },
        { name: 'Carrot', category: 'vegetable' },
        { name: 'Rice', category: 'grain' },
      ];
      test('groups names by category', () => {
        const r = namesByCategory(items);
        assert.deepEqual(Object.keys(r).toSorted(), ['fruit', 'grain', 'vegetable']);
      });
      test('sorts names inside each group', () => {
        const r = namesByCategory(items);
        assert.deepEqual(r.fruit, ['Apple', 'Banana']);
        assert.deepEqual(r.vegetable, ['Carrot', 'Leek']);
      });
      test('an empty list gives an empty object', () => assert.deepEqual({ ...namesByCategory([]) }, {}));
    </script>
