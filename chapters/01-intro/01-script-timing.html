<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../assets/demo.js"></script>
  <link rel="stylesheet" href="../../assets/style.css">
  <title>1-1 When Each Script Runs</title>
  <style>
    .stage { width: min(760px, 100%); }
    .panel { width: 100%; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    td.num { font-variant-numeric: tabular-nums; text-align: right; }
    .kind { display: inline-block; min-width: 64px; padding: 1px 8px; border-radius: 999px; font: 12px/1.6 var(--mono); text-align: center;
            background: color-mix(in oklch, var(--k) 16%, transparent); color: var(--k); }
    .classic { --k: var(--warn); }
    .defer { --k: var(--accent); }
    .async { --k: var(--bad); }
    .module { --k: var(--good); }
    .event { --k: var(--muted); }
  </style>
  <script>
    // A classic inline script in <head>: it runs right now, before the browser has read the <body>
    const timeline = [];
    function record(kind, name) {
      timeline.push({
        kind,
        name,
        time: performance.now(),
        readyState: document.readyState,
        sawWholePage: document.getElementById('page-end') !== null,
      });
      if (window.render) window.render();
    }
    record('classic', 'Inline <script> in <head>');
  </script>
  <script src="01-script-timing/defer.js" defer></script>
  <script src="01-script-timing/async.js" async></script>
  <script type="module" src="01-script-timing/module.js"></script>
</head>
<body class="demo">
  <div class="controls">
    <button class="btn btn-primary" id="reload" type="button">Reload the page</button>
  </div>
  <div class="stage">
    <div class="panel">
      <table>
        <thead>
          <tr><th>#</th><th>Kind</th><th>What ran</th><th class="num">Time (ms)</th><th>readyState</th><th>Saw page end?</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
  <script>
    // A classic inline script at the end of <body>: everything above it already exists
    record('classic', 'Inline <script> at the end of <body>');
    document.addEventListener('DOMContentLoaded', () => record('event', 'DOMContentLoaded event'));
    window.addEventListener('load', () => record('event', 'load event'));

    const rows = document.getElementById('rows');
    window.render = () => {
      rows.replaceChildren(...timeline.map((entry, i) => {
        const tr = document.createElement('tr');
        const cells = [
          String(i + 1),
          null,
          entry.name,
          entry.time.toFixed(1),
          entry.readyState,
          entry.sawWholePage ? 'yes' : 'no',
        ];
        cells.forEach((text, col) => {
          const td = document.createElement('td');
          if (col === 1) {
            const badge = document.createElement('span');
            badge.className = 'kind ' + entry.kind;
            badge.textContent = entry.kind;
            td.append(badge);
          } else {
            td.textContent = text;
          }
          if (col === 3) td.className = 'num';
          if (col === 5) td.className = entry.sawWholePage ? 'good' : 'bad';
          tr.append(td);
        });
        return tr;
      }));
    };
    render();
    document.getElementById('reload').addEventListener('click', () => location.reload());
  </script>
  <p id="page-end" hidden></p>
</body>
</html>
