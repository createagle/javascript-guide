<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../../assets/demo.js"></script>
  <link rel="stylesheet" href="../../../assets/style.css">
  <script src="../../../assets/playground.js" defer></script>
  <title>Exercise 4-2 · Final: Letter Grades</title>
</head>
<body class="demo">
  <div class="playground" data-title="Exercise 4-2">
    <script type="text/plain" class="code">
      // 90–100 → 'A', 80–89 → 'B', 70–79 → 'C', 60–69 → 'D', 0–59 → 'F'.
      // Anything that is not a number from 0 to 100 → null.
      function grade(score) {
        if (typeof score !== 'number' || !(score >= 0 && score <= 100)) return null;
        if (score >= 90) return 'A';
        if (score >= 80) return 'B';
        if (score >= 70) return 'C';
        if (score >= 60) return 'D';
        return 'F';
      }

      console.log(grade(95), grade(90), grade(42), grade(-5));
    </script>
    <script type="text/plain" class="tests">
      test('boundaries belong to the higher grade', () => {
        assert.equal(grade(90), 'A');
        assert.equal(grade(80), 'B');
        assert.equal(grade(70), 'C');
        assert.equal(grade(60), 'D');
      });
      test('values inside each band', () => {
        assert.equal(grade(100), 'A');
        assert.equal(grade(89.5), 'B');
        assert.equal(grade(59), 'F');
        assert.equal(grade(0), 'F');
      });
      test('out of range gives null', () => {
        assert.equal(grade(-5), null);
        assert.equal(grade(101), null);
      });
      test('non-numbers give null', () => {
        assert.equal(grade('95'), null);
        assert.equal(grade(NaN), null);
        assert.equal(grade(undefined), null);
      });
    </script>
  </div>
</body>
</html>
