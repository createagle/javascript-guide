  <title>Exercise 19-3 · Final: Write Promise.all Yourself</title>

<body class="demo">
  <div class="playground" data-title="Exercise 19-3">
    <script type="text/plain" class="code">
      // myAll(iterable) should behave like Promise.all:
      // - fulfill with all values, in the same order as the input (not the order they finish in)
      // - accept plain values as well as promises
      // - fulfill with [] for an empty input
      // - reject as soon as any of them rejects
      // Promise.withResolvers() is a handy way to start.
      function myAll(iterable) {
        const { promise, resolve, reject } = Promise.withResolvers();
        const items = [...iterable];
        const results = new Array(items.length);
        let remaining = items.length;
        if (remaining === 0) resolve([]);
        items.forEach((item, index) => {
          Promise.resolve(item).then((value) => {
            results[index] = value;          // the slot of the input, whatever the finishing order
            remaining -= 1;
            if (remaining === 0) resolve(results);
          }, reject);                        // the first rejection wins; later calls are ignored
        });
        return promise;
      }

      const after = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
      console.log(await myAll([after(30, 'slow'), after(10, 'fast'), 'now']));
    </script>
    <script type="text/plain" class="tests">
      const wait = (ms, value, fail) => new Promise((resolve, reject) => setTimeout(() => (fail ? reject(new Error(value)) : resolve(value)), ms));
      test('keeps the input order', async () => assert.deepEqual(await myAll([wait(40, 'a'), wait(5, 'b'), wait(20, 'c')]), ['a', 'b', 'c']));
      test('accepts plain values', async () => assert.deepEqual(await myAll([1, wait(5, 2), 3]), [1, 2, 3]));
      test('an empty input fulfills with []', async () => {
        const result = await Promise.race([myAll([]), wait(100, 'still pending')]);
        assert.deepEqual(result, []);
      });
      test('rejects as soon as one rejects', async () => {
        const start = Date.now();
        await assert.rejects(myAll([wait(400, 'slow'), wait(10, 'broken', true)]), /broken/);
        assert.ok(Date.now() - start < 200, 'it waited for the slow one');
      });
      test('returns a real promise', () => assert.ok(myAll([]) instanceof Promise));
    </script>
  </div>
</body>
