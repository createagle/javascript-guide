  <title>Exercise 39-3 · Final: A Sync Outbox</title>

<body class="demo">
  <div class="playground" data-title="Exercise 39-3">
    <script type="text/plain" class="code">
      // An outbox for syncing changes to a server: changes made offline wait here, in order, until they can be sent.
      // class Outbox:
      // - constructor(send): send(change) returns a promise; it rejects when the server cannot be reached
      // - add(change): change is { id, op: 'put' | 'delete', entry? }. A newer change to the same id replaces
      //   the waiting one (only the last state of an entry needs sending), but keeps the old one's place in line
      // - get pending(): the waiting changes, oldest first (a copy)
      // - flush(): sends the waiting changes one at a time, in order. When a send fails it stops: that change
      //   and the ones after it stay waiting. Resolves to the number of changes sent.
      //   Calling flush() while a flush is running returns the same promise (never send twice in parallel).
      //   Changes added during a flush are sent by that flush too.
      class Outbox {
        #send;
        #queue = [];
        #flushing = null;

        constructor(send) {
          this.#send = send;
        }

        get pending() {
          return [...this.#queue];
        }

        add(change) {
          const i = this.#queue.findIndex((waiting) => waiting.id === change.id);
          if (i === -1) this.#queue.push(change);
          else this.#queue[i] = change;   // same place in line, newest content
        }

        flush() {
          this.#flushing ??= this.#run().finally(() => { this.#flushing = null; });
          return this.#flushing;
        }

        async #run() {
          let sent = 0;
          while (this.#queue.length > 0) {
            const change = this.#queue[0];
            try {
              await this.#send(change);
            } catch {
              break;   // offline or server error: keep it, try again on the next flush
            }
            // Remove it only now, and only if add() did not replace it while it was being sent
            if (this.#queue[0] === change) this.#queue.shift();
            sent++;
          }
          return sent;
        }
      }

      let online = false;
      const outbox = new Outbox(async (change) => {
        if (!online) throw new Error('offline');
        console.log('sent', change.op, change.id);
      });
      outbox.add({ id: 'a', op: 'put', entry: { amount: 500 } });
      outbox.add({ id: 'b', op: 'put', entry: { amount: 900 } });
      outbox.add({ id: 'a', op: 'delete' });
      console.log('waiting:', outbox.pending.map((c) => `${c.op} ${c.id}`));
      console.log('sent while offline:', await outbox.flush().catch((error) => `failed: ${error.message}`));
      online = true;
      console.log('sent when back online:', await outbox.flush());
    </script>
    <script type="text/plain" class="tests">
      const recorder = (failAt = new Set()) => {
        const sent = [];
        let call = 0;
        const send = async (change) => {
          await Promise.resolve();
          if (failAt.has(++call)) throw new Error('offline');
          sent.push(`${change.op}:${change.id}`);
        };
        return { sent, send };
      };

      test('sends in order and empties the outbox', async () => {
        const { sent, send } = recorder();
        const box = new Outbox(send);
        box.add({ id: 'a', op: 'put' });
        box.add({ id: 'b', op: 'put' });
        assert.equal(await box.flush(), 2);
        assert.deepEqual(sent, ['put:a', 'put:b']);
        assert.deepEqual(box.pending, []);
      });
      test('a newer change to the same id replaces the waiting one, in its place', () => {
        const box = new Outbox(async () => {});
        box.add({ id: 'a', op: 'put', entry: 1 });
        box.add({ id: 'b', op: 'put' });
        box.add({ id: 'a', op: 'delete' });
        assert.deepEqual(box.pending.map((c) => `${c.op}:${c.id}`), ['delete:a', 'put:b']);
      });
      test('pending is a copy', () => {
        const box = new Outbox(async () => {});
        box.add({ id: 'a', op: 'put' });
        box.pending.length = 0;
        assert.equal(box.pending.length, 1);
      });
      test('a failed send stops the flush and keeps the rest', async () => {
        const { sent, send } = recorder(new Set([2]));
        const box = new Outbox(send);
        for (const id of ['a', 'b', 'c']) box.add({ id, op: 'put' });
        assert.equal(await box.flush(), 1);
        assert.deepEqual(box.pending.map((c) => c.id), ['b', 'c']);
        assert.equal(await box.flush(), 2);
        assert.deepEqual(sent, ['put:a', 'put:b', 'put:c']);
      });
      test('flush while flushing returns the same promise and sends nothing twice', async () => {
        const { sent, send } = recorder();
        const box = new Outbox(send);
        box.add({ id: 'a', op: 'put' });
        box.add({ id: 'b', op: 'put' });
        const first = box.flush();
        const second = box.flush();
        assert.ok(first === second, 'expected the same promise');
        await first;
        assert.deepEqual(sent, ['put:a', 'put:b']);
      });
      test('changes added during a flush are sent too', async () => {
        const { sent, send } = recorder();
        const box = new Outbox(send);
        box.add({ id: 'a', op: 'put' });
        const done = box.flush();
        box.add({ id: 'b', op: 'put' });
        assert.equal(await done, 2);
        assert.deepEqual(sent, ['put:a', 'put:b']);
      });
    </script>
  </div>
